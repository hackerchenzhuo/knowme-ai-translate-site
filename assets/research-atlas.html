</style></head><body>
<header><strong id="brand">研究图谱</strong><span>KNOWME / RESEARCH ATLAS</span><nav aria-label="Map view"><button id="overview" aria-pressed="true">关系全景</button><button id="focus" aria-pressed="false">关注示例</button></nav></header>
<div class="atlas-layout"><main class="plot"><div class="stats"><span><b id="node-count"></b><span id="nodes-label">本图节点</span></span><span><b id="edge-count"></b><span id="edges-label">本图连接</span></span><span><b id="paper-count"></b><span id="papers-label">篇依据</span></span></div><div class="canvas-wrap"><canvas class="canvas" id="atlas-canvas" tabindex="0" aria-label="Interactive public coauthorship network"></canvas><div id="loading">正在展开公开研究网络…</div><div class="controls"><button id="zoom-in" aria-label="Zoom in">+</button><button id="zoom-out" aria-label="Zoom out">−</button><button id="fit" aria-label="Reset view">⌖</button></div><span class="hint" id="hint">拖动探索 · 双击聚焦 · 选择作者或论文</span></div><div class="legend" id="legend"></div></main><aside class="detail"><input type="search" class="search" id="atlas-search" placeholder="搜索作者或论文" aria-label="Search authors or papers"><div class="results" id="results"></div><section id="detail-content"></section></aside></div>
<footer><span id="scope">当前视图 · 预置公开样本</span><span id="meaning">实际图谱随本地资料与关注更新。</span></footer>

<script type="module">
import {createResearchMapVisual,researchMapColors} from './research-map-view.js?v=20261022-perf1';
const en=new URLSearchParams(location.search).get('lang')==='en', t=(zh,eng)=>en?eng:zh;
document.documentElement.lang=en?'en':'zh-CN';
const strings={'brand':['研究图谱','Research Atlas'],'overview':['关系全景','Overview'],'focus':['关注示例','Focus example'],'nodes-label':['本图节点','visible nodes'],'edges-label':['本图连接','visible links'],'papers-label':['篇依据','source papers'],'hint':['拖动探索 · 双击聚焦 · 选择作者或论文','Drag to explore · Double-click to focus · Select a paper'],'scope':['当前视图 · 预置公开样本','Current view · Preset public sample'],'meaning':['实际图谱随本地资料与关注更新。','The actual map changes with local evidence and interests.'],'loading':['正在展开公开研究网络…','Opening the public research network…']};
for(const[id,words]of Object.entries(strings))document.getElementById(id).textContent=t(...words);
const search=document.getElementById('atlas-search');search.placeholder=t('搜索作者或论文','Find an author or paper');
const packed=await fetch('./research-atlas-data.json?v=20261022').then(r=>{if(!r.ok)throw new Error('Data unavailable');return r.json()}).catch(error=>{document.getElementById('loading').textContent=t('公开数据暂不可用，请刷新重试。','Public data is temporarily unavailable. Please reload.');throw error});
const graph={nodes:packed.nodes.map(n=>({id:n[0],name:n[1],x:n[2],y:n[3],paperCount:n[4],group:packed.groups[n[5]],confidence:n[6],paperIds:n[7].map(i=>packed.papers[i][0]),attention:0})),edges:packed.edges.map(e=>({source:packed.nodes[e[0]][0],target:packed.nodes[e[1]][0],count:e[2],paperIds:e[3].map(i=>packed.papers[i][0])})),papers:packed.papers.map(p=>({id:p[0],title:p[1],year:p[2],url:p[3],source:p[4],version:p[5]}))};
const nodes=new Map(graph.nodes.map(n=>[n.id,n])),papers=new Map(graph.papers.map(p=>[p.id,p]));
const content=document.getElementById('detail-content'),results=document.getElementById('results');
const caseId='arxiv:'+packed.source.caseId, caseAuthor=graph.nodes.find(n=>n.name===packed.source.caseAuthor&&n.paperIds.includes(caseId));
let selected='',selectedPaper='',personal=false;
const visual=createResearchMapVisual(document.getElementById('atlas-canvas'),{onSelect:id=>selectAuthor(id),onViewChange:()=>{if(!window.__atlasReady){document.getElementById('loading').hidden=true;window.__atlasReady=true;if(parent!==window)parent.postMessage({type:'knowme-atlas-ready'},location.origin);}}});visual.setGraph(graph);
for(const[id,value]of [['node-count',graph.nodes.length],['edge-count',graph.edges.length],['paper-count',packed.totals.evidencePapers]])document.getElementById(id).textContent=value.toLocaleString(en?'en-US':'zh-CN');
function element(tag,text,attributes={},parent){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;for(const[k,v]of Object.entries(attributes))e.setAttribute(k,v);if(parent)parent.appendChild(e);return e}
function button(text,handler,classes,parent){const b=element('button',text,{type:'button',...(classes?{class:classes}:{})},parent);b.onclick=handler;return b}
function paragraph(zh,english,classes='',parent=content){return element('p',t(zh,english),classes?{class:classes}:{},parent)}
function link(text,url,parent){return element('a',text,{href:url,target:'_blank',rel:'noopener noreferrer'},parent)}
function resetSearch(){search.value='';results.replaceChildren();visual.setState({query:''})}
function nameNode(name,paperId){const matches=graph.nodes.filter(n=>n.name.toLowerCase()===name.toLowerCase()&&n.paperIds.includes(paperId));return matches.length===1?matches[0]:null}
for(const[group,value]of Object.entries(researchMapColors)){if(!graph.nodes.some(n=>n.group===group))continue;const item=element('span',undefined,{},document.getElementById('legend'));const dot=element('i',undefined,{},item);dot.style.background=value;item.append(document.createTextNode(group))}
function intro(){content.replaceChildren();paragraph('LOCAL EVOLUTION','LOCAL EVOLUTION','eyebrow');element('h2',t('随关注，持续演化。','Evolving with your interests.'),{},content);paragraph('从论文发现作者，从作者延伸到合作网络。阅读带来新的公开线索，也让近期关注逐渐清晰。','Follow papers to authors and collaborators. As public evidence accumulates, your recent research interests come into focus.');paragraph('在插件中开启本地演化后，访问 Scholar 作者主页即可补充相关书目与共作线索。研究方向与积累的书目共同形成私人作者权重，进入每篇论文的个人分。','With local evolution enabled in the extension, visits to Scholar author pages add bibliographic and coauthorship evidence. Your research interests and accumulated bibliography shape private author weights that contribute to each paper’s personal score.');const walk=button(t('沿一篇论文展开','Follow a paper through the graph'),()=>{if(caseAuthor)selectAuthor(caseAuthor.id);else selectPaper(caseId)},'walk',content);walk.id='walkthrough';element('span','→',{},walk);element('span',t('持续演进 · 功能预览','Continually evolving · Feature preview'),{class:'pill',style:'margin-top:22px'},content);paragraph('预置公开数据，不读取你的插件、偏好或浏览记录。','Preset public data. This page does not access your extension, preferences or browsing activity.','note')}
function selectAuthor(id){const node=nodes.get(id);if(!node)return;selected=id;selectedPaper='';resetSearch();visual.setState({selected,personal,paperId:''});visual.focus(id);content.replaceChildren();paragraph('AUTHOR / EVIDENCE','AUTHOR / EVIDENCE','eyebrow');element('h2',node.name,{},content);paragraph(node.confidence==='graph'?'既有图谱实体 · 关系推断':'单篇署名 · 未跨文献消歧',node.confidence==='graph'?'Existing graph entity · inferred relationship':'Paper-scoped name · identity unresolved','note');const connections=graph.edges.filter(e=>e.source===id||e.target===id).sort((a,b)=>b.count-a.count);paragraph(`本图 ${node.paperCount} 篇论文 · ${connections.length} 位可见合作者`,`${node.paperCount} papers in this sample · ${connections.length} visible coauthors`);if(node.paperIds.includes(caseId)){const b=button(t('查看论文与私人权重','Inspect the paper and personal weights'),()=>selectPaper(caseId),'walk',content);b.id='open-rrsi';element('span','→',{},b)}element('h3',t('共同署名','COAUTHORS'),{},content);const partners=element('div',undefined,{class:'partners'},content);for(const edge of connections.slice(0,5)){const other=nodes.get(edge.source===id?edge.target:edge.source);const b=button(other.name,()=>selectAuthor(other.id),'',partners);element('span',`${edge.count} ${t('篇','papers')}`,{},b)}element('h3',t('论文依据','PAPER EVIDENCE'),{},content);const list=element('ol',undefined,{class:'papers'},content);for(const id of node.paperIds.slice(0,8)){const p=papers.get(id);if(!p)continue;const li=element('li',undefined,{},list);button(p.title,()=>selectPaper(id),'',li);element('small',`${p.source} · ${p.year} · ${t('查看贡献依据','Inspect scoring evidence')} →`,{},li)}button(t('返回全景','Back to overview'),()=>overview(),'back',content)}
const sourceLabels={'PQ 作者图谱':'PQ author graph','作者名录':'Author catalogue','LLM 作者名录':'LLM author catalogue','近期作者名录':'Recent author catalogue','NLP 作者名录':'NLP author catalogue'};
const signed=n=>(n>=0?'+':'−')+Math.abs(n).toFixed(1);
let direction='agents';
const institutionNames={berkeley:'UC Berkeley',washington:'University of Washington',princeton:'Princeton University',stanford:'Stanford University',meta:'Meta'};
function selectPaper(id){
 const paper=papers.get(id);if(!paper)return;selectedPaper=id;resetSearch();visual.setState({selected,personal,paperId:id});visual.focusPaper(id);content.replaceChildren();
 button(t('← 返回作者关系','← Back to the author'),()=>selected?selectAuthor(selected):overview(),'back',content);
 paragraph('PAPER / EVIDENCE','PAPER / EVIDENCE','eyebrow');element('h2',paper.title,{class:'paper-title'},content);
 paragraph(paper.source+' · '+id+' · '+packed.asOf,paper.source+' · '+id+' · '+packed.asOf,'note');
 const preview=packed.personalExamples.papers.find(p=>'arxiv:'+p.id===id);
 if(preview){
  const tabs=element('div',undefined,{class:'steps'},content);
  for(const key of ['agents','vision']){const b=button(key==='agents'?t('Agent 与推理','Agents & reasoning'):t('视觉与多模态','Vision & multimodal'),()=>{direction=key;selectPaper(id)},'',tabs);b.dataset.paperProfile=key;b.setAttribute('aria-pressed',String(direction===key));}
  const sample=preview.cases.find(c=>c.id===direction),cards=element('div',undefined,{class:'score'},content);
  for(const [label,value]of [[t('基础原始分','Base raw score'),sample.base],[t('论文个人分','Personal paper score'),sample.total]]){const box=element('div',undefined,{},cards);element('small',label,{},box);element('b',value.toFixed(1),{},box);}
  paragraph(t('自动计算的私人调整：作者 ','Calculated personal adjustments: authors ')+signed(sample.authorAdjustment)+t('，机构 ',', institutions ')+signed(sample.institutionAdjustment), 'Calculated personal adjustments: authors '+signed(sample.authorAdjustment)+', institutions '+signed(sample.institutionAdjustment),'proof-note');
  element('h3',t('作者在我的研究体系中','AUTHOR WEIGHTS'),{},content);
  for(const author of sample.authors){const row=element('div',undefined,{class:'contributor'},content),top=element('div',undefined,{},row);element('strong',author.name,{},top);element('b','×'+author.weight.toFixed(3),{},top);paragraph(author.state==='ready'?`${author.judged} 篇可用书目 · ${author.matched} 篇方向匹配`:'当前可用身份与书目依据不足，保持中性。',author.state==='ready'?`${author.judged} usable records · ${author.matched} topic matches`:'Insufficient resolved bibliography in this snapshot; neutral weight.','note',row);}
  element('h3',t('机构与领域依据','INSTITUTIONS & FIELD EVIDENCE'),{},content);
  for(const institution of sample.institutions){const row=element('div',undefined,{class:'contributor'},content),top=element('div',undefined,{},row);element('strong',en?(institutionNames[institution.id]||institution.name):institution.name,{},top);element('b','×'+institution.weight.toFixed(3),{},top);paragraph(institution.papers.toLocaleString()+' 篇已核书目 · '+institution.keywords.join(' / '),institution.papers.toLocaleString()+' evidenced papers · '+institution.keywords.join(' / '),'note',row);if(institution.examples[0])link(institution.examples[0].title+' ↗',institution.examples[0].url,row);}
  const detail=element('details',undefined,{class:'calculation'},content);element('summary',t('计算依据与边界','Calculation and scope'),{},detail);
  paragraph('私人权重来自预置研究偏好与公开书目。机构关键词使用词频与区分度，近期论文以时间衰减计入，小样本向中性收缩。基础证据与既有评估规则另列。','Personal weights use preset interests and public bibliography. Institutional keywords use term frequency and distinctiveness; time decay favors recent signals and small samples shrink toward neutral. Base evidence and existing assessment rules are separate.','',detail);
  paragraph('作者与机构名称仅用于演示，不代表认可、合作或背书。','Names identify public bibliography and do not imply endorsement, affiliation or partnership.','',detail);
 }else paragraph('共同署名可追溯至原论文。完整作者与机构证据，可在论文雷达中继续查看。','Shared authorship is traceable to the paper. Continue in Paper Radar for author and institution evidence.');
 const actions=element('div',undefined,{class:'actions'},content);link(t('论文原文 ↗','Read the paper ↗'),paper.url,actions);link(t('查看插件 ↗','View the extension ↗'),'https://chromewebstore.google.com/detail/aneomkhamcijmfmeeegocbknklflilof',actions);
}
function overview(){selected='';selectedPaper='';personal=false;resetSearch();visual.setState({selected:'',paperId:'',personal:false});visual.reset();document.getElementById('overview').setAttribute('aria-pressed','true');document.getElementById('focus').setAttribute('aria-pressed','false');intro()}
document.getElementById('overview').onclick=overview;document.getElementById('focus').onclick=()=>{selected='';selectedPaper='';personal=true;for(const node of graph.nodes)node.attention=['Luke Zettlemoyer','Jason Wei','Maneesh Agrawala'].includes(node.name)?1:0;resetSearch();visual.setState({selected:'',paperId:'',personal:true});visual.reset();document.getElementById('overview').setAttribute('aria-pressed','false');document.getElementById('focus').setAttribute('aria-pressed','true');intro();paragraph('当前显示预置的关注示例，仅演示个人视图如何变化。','This preset focus example illustrates how a personal view can change.','proof-note')};
document.getElementById('zoom-in').onclick=()=>visual.zoom(.75);document.getElementById('zoom-out').onclick=()=>visual.zoom(1.33);document.getElementById('fit').onclick=overview;
search.addEventListener('input',()=>{const query=search.value.trim().toLowerCase();results.replaceChildren();visual.setState({query});if(!query)return;const authors=graph.nodes.filter(n=>n.name.toLowerCase().includes(query)).slice(0,5),matches=graph.papers.filter(p=>p.title.toLowerCase().includes(query)||p.id.includes(query)).slice(0,4);if(authors.length){element('small',t('作者','AUTHORS'),{},results);for(const node of authors){const b=button(node.name,()=>selectAuthor(node.id),'',results);element('span',`${node.paperCount} ${t('篇','papers')}`,{},b)}}if(matches.length){element('small',t('论文','PAPERS'),{},results);for(const p of matches)button(p.title,()=>selectPaper(p.id),'',results)}if(!authors.length&&!matches.length)element('small',t('当前样本中没有匹配结果','No match in this sample'),{},results)});
document.getElementById('scope').textContent=t('当前显示 '+graph.nodes.length.toLocaleString()+' 个节点 · 公开样本含 '+packed.totals.availableNodes.toLocaleString()+' 条署名实体线索',graph.nodes.length.toLocaleString()+' displayed nodes · '+packed.totals.availableNodes.toLocaleString()+' byline/entity records in the public sample');
intro();
</script></body></html>
